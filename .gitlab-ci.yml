stages:
  - test
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.check:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

go-check:
  extends: .check
  image: "golang:$GO_VERSION"
  parallel:
    matrix:
      - GO_VERSION: ["1.22", "1.27"]
  script:
    - test -z "$(gofmt -l tanksd.go tanksd_test.go)"
    - go vet tanksd.go tanksd_test.go
    - go test -race -count=1 tanksd.go tanksd_test.go
    - go build -o tanksd tanksd.go

c-check:
  extends: .check
  image: gcc:13
  variables:
    C_CHECK_FLAGS: >-
      -Wall -Wextra -Wformat=2
      -Werror=format-security -Werror=absolute-value
      -g -O1 -fsanitize=address,undefined
      -fno-sanitize-recover=all -fno-omit-frame-pointer
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
  script:
    - make clean
    - make CFLAGS="$C_CHECK_FLAGS" LDFLAGS="$C_CHECK_FLAGS" forftanks test-forf
    - SEED=12345 ./forftanks examples/* > round.json
    - |
      python3 - <<'PY'
      import json

      with open("round.json") as source:
          game = json.load(source)

      assert game["rounds"], "No game frames generated"
      assert len(game["tanks"]) == 6, "Unexpected example tank count"
      errors = [
          (tank["name"], tank["error"])
          for tank in game["tanks"]
          if tank["error"] != "None"
      ]
      assert not errors, errors
      PY
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - round.json

javascript-check:
  extends: .check
  image: node:22-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl coreutils
  script:
    - for file in www/*.mjs; do node --check "$file"; done
    - node --test tests/upload-script.test.mjs

publish:
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - image_tag="${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --tag="$CI_REGISTRY_IMAGE:$image_tag" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:$image_tag"
