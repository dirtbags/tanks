<!DOCTYPE html>
<html>
  <head>
    <title>Tanks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="main.mjs" type="module"></script>
  </head>
  <body>
    <h1>Tanks</h1>

    <fieldset>
      <legend>
        Game Replay
      </legend>

      <div>
        <select id="game">
          <option>latest</option>
        </select>
        <output id="date">moo</output>
      </div>

      <div id="game_box">
        <canvas id="battlefield"></canvas>
      </div>

      <table id="results">
        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>Kills</th>
            <th>Death</th>
            <th>Killer</th>
            <th>Error</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <hr>

      <table id="stats">
        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>Games</th>
            <th>Kills</th>
            <th>Killed</th>
            <th>Awards</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>

    <form id="upload">
      <fieldset>
        <legend>Tank Designer</legend>
        <fieldset class="program">
          <legend>Program</legend>
          <textarea name="program">get-turret 12 + set-turret! ( Rotate turret )
37 40 set-speed!            ( Go in circles )

( Fire if turret sensor triggered )
0 sensor? { fire! } if              

( Turn if collision sensor triggered )
1 sensor? { -50 50 set-speed! } if  
          </textarea>
          <div>
            <a href="https://dirtbags.net/tanks/forf.html">Forf manual</a> <br>
            <a href="https://dirtbags.net/tanks/procs.html">Tank procedures</a>
          </div>
        </fieldset>

        <fieldset>
          <legend>Sensors</legend>
          <table id="sensors">
            <thead>
              <tr>
                <td>№</td>
                <td>Range</td>
                <td>Angle</td>
                <td>Width</td>
                <td>Turret?</td>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>0</td>
                <td><input name="s0r" type="number" min="0" max="100" value="50"></td>
                <td><input name="s0a" type="number" min="-360" max="360" value="0"></td>
                <td><input name="s0w" type="number" min="-360" max="360" value="7"></td>
                <td><input name="s0t" type="checkbox" value="on" checked></td>
              </tr>
              <tr>
                <td>1</td>
                <td><input name="s1r" type="number" min="0" max="100" value="30"></td>
                <td><input name="s1a" type="number" min="-360" max="360" value="0"></td>
                <td><input name="s1w" type="number" min="-360" max="360" value="90"></td>
                <td><input name="s1t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>2</td>
                <td><input name="s2r" type="number" min="0" max="100"></td>
                <td><input name="s2a" type="number" min="-360" max="360"></td>
                <td><input name="s2w" type="number" min="-360" max="360"></td>
                <td><input name="s2t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>3</td>
                <td><input name="s3r" type="number" min="0" max="100"></td>
                <td><input name="s3a" type="number" min="-360" max="360"></td>
                <td><input name="s3w" type="number" min="-360" max="360"></td>
                <td><input name="s3t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>4</td>
                <td><input name="s4r" type="number" min="0" max="100"></td>
                <td><input name="s4a" type="number" min="-360" max="360"></td>
                <td><input name="s4w" type="number" min="-360" max="360"></td>
                <td><input name="s4t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>5</td>
                <td><input name="s5r" type="number" min="0" max="100"></td>
                <td><input name="s5a" type="number" min="-360" max="360"></td>
                <td><input name="s5w" type="number" min="-360" max="360"></td>
                <td><input name="s5t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>6</td>
                <td><input name="s6r" type="number" min="0" max="100"></td>
                <td><input name="s6a" type="number" min="-360" max="360"></td>
                <td><input name="s6w" type="number" min="-360" max="360"></td>
                <td><input name="s6t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>7</td>
                <td><input name="s7r" type="number" min="0" max="100"></td>
                <td><input name="s7a" type="number" min="-360" max="360"></td>
                <td><input name="s7w" type="number" min="-360" max="360"></td>
                <td><input name="s7t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>8</td>
                <td><input name="s8r" type="number" min="0" max="100"></td>
                <td><input name="s8a" type="number" min="-360" max="360"></td>
                <td><input name="s8w" type="number" min="-360" max="360"></td>
                <td><input name="s8t" type="checkbox" value="on"></td>
              </tr>
              <tr>
                <td>9</td>
                <td><input name="s9r" type="number" min="0" max="100"></td>
                <td><input name="s9a" type="number" min="-360" max="360"></td>
                <td><input name="s9w" type="number" min="-360" max="360"></td><td>
                  <input name="s9t" type="checkbox" value="on"></td>
              </tr>
            </tbody>
          </table>
        </fieldset>

        <fieldset id="preview">
          <legend>Preview</legend>
          <div>
            <canvas id="design"></canvas>
          </div>
        </fieldset>

        <div>
          <div>
            <label>Token:
              <input type="text" name="id" placeholder="Token provided by game owner" required>
            </label>
          </div>

          <div>
            <label>Name:
              <input type="text" name="name" placeholder="Tank name" required>
            </label>
          </div>

          <div>
            <label>Author:
              <input type="text" name="author" placeholder="Your name" required>
            </label>
          </div>

          <div>
            <input type="color" name="color" value="#cccccc" required>
          </div>

          <input type="submit" value="Upload">
          <input type="submit" value="Copy upload script" data-script>

          <div id="debug"></div>
        </div>

      </fieldset>
    </form>
  </body>
</html>
